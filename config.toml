baseURL = "https://divviup.org"
languageCode = "en-us"
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
copyrighthtml = "Internet Security Research Group"
address = "548 Market St, PMB 77519, San Francisco, California 94104-5401"
address_line_1 = "548 Market St, PMB 77519"
address_line_2 = "San Francisco, California 94104-5401"
images = ["images/DivviUpSocialShare.png"]
meta_description = "Divvi Up is a privacy-respecting telemetry service for web, mobile, and machine learning applications, brought to you by the Internet Security Research Group."
social_share_twitter_square = "/images/DivviUpSocialShare-Twitter.png"
site_banner_enabled = false
# Previous usage of site_banner_href and site_banner_text
site_banner_href = "https://abetterinternet.org/tenth-anniversary"
site_banner_text = "ISRG celebrates 10 years of helping build a brighter Internet"


# Date and time formatting, see https://gohugo.io/functions/format/
time_format_default = "Jan 2, 2006"
time_format_RFC3339 = "2006-01-02T15:04:05Z07:00"
time_format_RFC822 = "Mon, 02 Jan 2006 15:04:05 -0700"

[markup]
defaultMarkdownHandler = "goldmark"

[markup.goldmark]
[markup.goldmark.extensions]
typographer = false
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
# To keep § ids identical after the migration from blackfriday to goldmark
autoHeadingIDType = "blackfriday"

[languages]
[languages.en]
title = "Divvi Up"
languageName ="English"
# Weight used for sorting.
weight = 1
[languages.en.params]
description = "Divvi Up is a privacy-respecting telemetry service for web, mobile, and machine learning applications, brought to you by the Internet Security Research Group."

# Site banner messages with dates; see "Site banner" in README.md.
[[params.site_banner_schedule]]
id = "giving-tuesday"
start = "2026-12-01T00:00:00-06:00"
end = "2026-12-02T00:00:00-06:00"
text = "It’s Giving Tuesday! As a nonprofit, we rely on our generous community of donors."
label = "Donate Today"
href = "https://www.abetterinternet.org/donate/"

[[params.site_banner_schedule]]
id = "monthly"
start = "2026-12-02T00:00:00-06:00"
end = "2026-12-26T00:00:00-06:00"
text = "As we look toward 2027, consider a gift that keeps on giving. Internet security!"
label = "Donate monthly"
href = "https://www.abetterinternet.org/donate/"

[[params.site_banner_schedule]]
id = "year-end"
start = "2026-12-26T00:00:00-06:00"
end = "2027-01-01T00:00:00-06:00"
text = "ISRG protects billions of people online, every day. Join us by making a donation before December 31 to finish the year strong."
